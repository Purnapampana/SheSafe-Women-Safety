<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Emergency</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="desktop.css">

</head>

<body>

<div class="dashboard">

    <header class="dashboard-header">

        <div>
            <h1>🚨 SOS Emergency</h1>
            <p>Get immediate help</p>
        </div>

        <button onclick="window.location.href='home.html'">
            Back
        </button>

    </header>


    <div class="feature-page">

        <h2>Emergency Alert</h2>

        <p>
            Press the SOS button if you are in danger.
        </p>

        <div class="sos-container">

            <button
                class="sos-button"
                onclick="triggerSOS()">

                SOS

            </button>
            <button
    onclick="stopSOSRecording()"
    style="
        background: #dc3545;
        color: white;
        padding: 14px 25px;
        border: none;
        border-radius: 8px;
        margin-top: 15px;
        cursor: pointer;
    ">

    ⛔ Stop Recording

</button>

        </div>
        

        <div
            id="sosStatus"
            class="status-box">

            No emergency activated.

        </div>


       

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
